name: HomeStock
version: "2.0.0-alpha.1"
slug: homestock
description: Motore HomeStock per scansioni, voce, AI e diagnostica
url: https://github.com/Sangua90/food-scanner
arch:
  - amd64
  - aarch64
  - armv7
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-analytics
panel_title: HomeStock Engine
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
map:
  - type: addon_config
    read_only: false
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
backup: hot
stage: experimental
